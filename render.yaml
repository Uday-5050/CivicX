services:
  - type: web
    name: civix-backend
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm --prefix client ci --include=dev && npm --prefix client run build && npm --prefix server/backend ci --include=dev && npm --prefix server/backend run build
    startCommand: npm --prefix server/backend start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: LOG_LEVEL
        value: info
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_WORKER_ENABLED
        value: "true"
